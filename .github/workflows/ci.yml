name: Dragon Warriors CI

on:
  pull_request:
    branches:
      - python-driven-version
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Build C++ and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: g++ --version

      - name: Compile legacy C++ suite
        working-directory: sut/legacy
        run: g++ -std=c++11 -O0 -g main.cpp dragon.cpp -I . -o dragon_tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Show Python version
        run: python --version

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Pytest unit tests
        run: python -m pytest --layer unit --junitxml=reports/unit.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: reports/unit.xml
          if-no-files-found: warn

  structural-tests:
    name: Run structural contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: g++ --version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run structural tests
        run: python -m pytest --layer structural --junitxml=reports/structural.xml

      - name: Upload structural diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: structural-test-diagnostics
          path: |
            reports/structural.xml
            reports/structural-diagnostics/
          if-no-files-found: warn

  integration-tests:
    name: Run configuration and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: g++ --version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run integration tests
        run: python -m pytest --layer integration --junitxml=reports/integration.xml

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-diagnostics
          path: |
            reports/integration.xml
            reports/integration-diagnostics/
          if-no-files-found: warn

  regression-tests:
    name: Domain regression (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cxx: g++
          - name: Clang
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: $CXX --version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run domain regression tests
        run: python -m pytest --layer regression --junitxml=reports/regression.xml

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-${{ matrix.name }}
          path: reports/regression.xml
          if-no-files-found: warn

  quality-gate:
    name: Required CI quality gate
    if: always()
    needs:
      - unit-tests
      - structural-tests
      - integration-tests
      - regression-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI test job to pass
        run: |
          test "${{ needs.unit-tests.result }}" = "success"
          test "${{ needs.structural-tests.result }}" = "success"
          test "${{ needs.integration-tests.result }}" = "success"
          test "${{ needs.regression-tests.result }}" = "success"
