name: Dragon Warriors CI

on:
  pull_request:
    branches:
      - python-driven-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build C++ and run smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: g++ --version

      - name: Compile legacy C++ suite
        working-directory: sut/legacy
        run: g++ -std=c++11 -O0 -g main.cpp dragon.cpp -I . -o dragon_tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Show Python version
        run: python --version

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Pytest smoke tests
        run: python -m pytest --layer smoke
