name: Dragon Warriors Nightly Memory Safety

on:
  schedule:
    - cron: "17 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  address-sanitizer:
    name: AddressSanitizer lifecycle tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CXX: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: $CXX --version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run AddressSanitizer tests
        run: python -m pytest --layer memory --junitxml=reports/memory.xml

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-safety-diagnostics
          path: |
            reports/memory.xml
            reports/memory-diagnostics/
          if-no-files-found: warn
