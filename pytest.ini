[pytest]
testpaths = tests
addopts = --strict-markers -ra -v --tb=short --durations=5
console_output_style = progress
markers =
    framework: self-tests for the Python framework
    smoke: fast end-to-end compiler and runner check
    unit: focused C++ domain behavior
    structural: compile-time OOP contract check
    integration: multi-component or full-program behavior
    memory: sanitizer or leak-checking test
    slow: test that is intentionally slower than the default unit slice
